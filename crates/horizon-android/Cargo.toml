[package]
name = "horizon-android"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Android NativeActivity entry point for the Horizon Rust client"

[lib]
name = "horizon_android"
crate-type = ["cdylib"]

[dependencies]
horizon-client = { path = "../horizon-client", default-features = false, features = ["audio"] }
horizon-threads = { path = "../horizon-threads" }
winit = { version = "0.30.13", features = ["android-native-activity"] }

[lints]
workspace = true
