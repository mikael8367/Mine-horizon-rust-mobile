name: Android 12 emulator boot test

on:
  push:
    branches: [mobile/android-port]
    paths:
      - "mobile/**"
      - "crates/horizon-android/**"
      - "crates/horizon-threads/**"
      - "crates/horizon-client/**"
      - "crates/horizon-client-lib/**"
      - "crates/horizon-client-input/**"
      - "crates/horizon-client-render/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-boot-test.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-boot-test-${{ github.ref }}
  cancel-in-progress: true

# Boots the CI-built APK on an Android 12 (API 31) emulator, launches the
# launcher activity exactly as a tap on the app icon does, and keeps the
# process alive check plus the full logcat as evidence. The logcat is also
# committed back to mobile/diagnostics/ so the crash (if any) can be read
# from the repository without a physical device.
jobs:
  boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.2.12479018"

      - name: Configure Android ARM64 linker
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"

      - name: Build Horizon Rust renderer for Android ARM64
        run: cargo build --release --target aarch64-linux-android -p horizon-android

      - name: Build Horizon vanilla preparer for Android ARM64
        run: cargo build --release --target aarch64-linux-android -p horizon-prepare

      - name: Stage Android preparer and Horizon-only support sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/app/src/main/assets/bin
          mkdir -p mobile/app/src/main/assets/prepare-root/crates/horizon-prepare/src
          mkdir -p mobile/app/src/main/assets/prepare-root/mods/horizon/src/test/java/dev/horizonlab
          install -m 0755 target/aarch64-linux-android/release/horizon-prepare mobile/app/src/main/assets/bin/horizon-prepare
          cp research-lock.json mobile/app/src/main/assets/prepare-root/research-lock.json
          cp crates/horizon-prepare/src/exporters.rs mobile/app/src/main/assets/prepare-root/crates/horizon-prepare/src/exporters.rs
          cp -a mods/horizon/src/test/java/dev/horizonlab/parity mobile/app/src/main/assets/prepare-root/mods/horizon/src/test/java/dev/horizonlab/

      - name: Stage native renderer
        shell: bash
        run: |
          set -euo pipefail
          LIBDIR="mobile/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$LIBDIR"
          cp target/aarch64-linux-android/release/libhorizon_android.so "$LIBDIR/"
          file "$LIBDIR/libhorizon_android.so"
          readelf -h "$LIBDIR/libhorizon_android.so" | grep -E 'Machine:.*AArch64'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: mobile
        run: gradle --no-daemon :app:assembleDebug

      - name: Inspect APK manifest and libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package:|launchable-activity|sdkVersion|targetSdkVersion|native-code" || true
          unzip -Z1 "$APK" | grep -F "lib/arm64-v8a/" || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install Android 12 (API 31) emulator system image
        run: |
          sdkmanager --install "emulator" "platform-tools" "platforms;android-31" "build-tools;35.0.0" "system-images;android-31;google_apis;x86_64" > /dev/null

      - name: Create AVD
        run: |
          echo no | avdmanager create avd -n horizon-a12 -k "system-images;android-31;google_apis;x86_64" -d pixel_4 --force
          avdmanager list avd

      - name: Boot emulator
        run: |
          emulator -avd horizon-a12 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -no-snapshot -camera-back none -camera-front none > emulator-boot.log 2>&1 &
          adb wait-for-device
          timeout 900 bash -c 'while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" != "1" ]; do sleep 10; done'
          echo "Android release: $(adb shell getprop ro.build.version.release | tr -d '\r')"
          echo "Android SDK: $(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          echo "ABI list: $(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"

      - name: Install APK and launch the launcher
        run: |
          adb install -r mobile/app/build/outputs/apk/debug/app-debug.apk
          adb logcat -c
          adb shell am start -W -n dev.playhorizon.mobile/.MainActivity
          sleep 30
          adb shell pidof dev.playhorizon.mobile > app-pid.txt || true
          adb logcat -d -b crash > emulator-crash-buffer.txt || true
          adb logcat -d -t 12000 > emulator-logcat.txt
          echo "PID after 30s: $(cat app-pid.txt)"
          adb shell dumpsys activity activities | grep -E "dev.playhorizon" | head -10 || true

      - name: Verdict
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p mobile/diagnostics
          PID="$(tr -d '\r[:space:]' < app-pid.txt)"
          {
            echo "Emulador: Android 12 (API 31), x86_64 com tradução ARM, GPU SwiftShader."
            echo "APK: app-debug.apk (arm64-v8a), instalado e iniciado com am start."
            if [ -n "$PID" ]; then
              echo "RESULTADO: o launcher permaneceu aberto (pid $PID) 30 s após a abertura."
            else
              echo "RESULTADO: FALHA. O processo não estava vivo 30 s após a abertura."
            fi
            if [ -s emulator-crash-buffer.txt ]; then
              echo "Buffer de crash do logcat não vazio; primeiras ocorrências:"
              grep -nE "FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT|Process: dev.playhorizon" emulator-crash-buffer.txt | head -40 || true
              head -200 emulator-crash-buffer.txt
            fi
          } > mobile/diagnostics/emulator-summary.txt
          cat mobile/diagnostics/emulator-summary.txt
          if [ -z "$PID" ]; then
            exit 1
          fi
          if grep -qE "FATAL EXCEPTION|Fatal signal" emulator-crash-buffer.txt emulator-logcat.txt; then
            echo "Marcador de crash encontrado no logcat mesmo com o processo vivo."
            exit 1
          fi

      - name: Publish diagnostics to the branch
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p mobile/diagnostics
          cp emulator-crash-buffer.txt mobile/diagnostics/emulator-crash-buffer.txt 2>/dev/null || true
          cp emulator-logcat.txt mobile/diagnostics/emulator-logcat.txt 2>/dev/null || true
          cp emulator-boot.log mobile/diagnostics/emulator-boot.log 2>/dev/null || true
          git config user.name "Horizon CI"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/diagnostics
          if git commit -m "Record Android 12 emulator boot diagnostics [skip ci]"; then
            git push origin HEAD:mobile/android-port
          else
            echo "Nada novo para registrar."
          fi

      - name: Upload boot-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-boot-test-api31
          path: |
            mobile/diagnostics/emulator-summary.txt
            mobile/diagnostics/emulator-logcat.txt
            mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
