name: Android 12 emulator boot test

on:
  push:
    branches: [mobile/android-port]
    paths:
      - "mobile/**"
      - "crates/horizon-android/**"
      - "crates/horizon-threads/**"
      - "crates/horizon-client/**"
      - "crates/horizon-client-lib/**"
      - "crates/horizon-client-input/**"
      - "crates/horizon-client-render/**"
      - "crates/horizon-prepare/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-boot-test.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-boot-test-${{ github.ref }}
  cancel-in-progress: true

# Boots the CI-built APK on an Android 12 (API 31) x86_64 emulator with KVM
# and SwiftShader. The test APK carries both arm64-v8a (Galaxy A12) and
# x86_64 (emulator) native libraries so the launcher can really start in CI.
# It launches the launcher activity exactly as a tap on the app icon does,
# checks process liveness after 30 s, then starts the native engine
# (NativeActivity) exactly as the launcher's "Abrir motor Rust" button does
# and checks liveness and the native startup status file again. The crash
# buffer, the full logcat, the native startup status file and the launcher
# diagnostics are all committed back to mobile/diagnostics/ so failures can
# be read from the repository without a physical device.
jobs:
  boot-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android x86_64-linux-android

      - name: Install Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.2.12479018"

      - name: Configure Android linkers (ARM64 and x86_64)
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
            echo "CC_aarch64_linux_android=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
            echo "AR_aarch64_linux_android=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
            echo "CC_x86_64_linux_android=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang"
            echo "AR_x86_64_linux_android=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          } >> "$GITHUB_ENV"

      - name: Build Horizon Rust renderer for Android ARM64
        run: cargo build --release --target aarch64-linux-android -p horizon-android

      - name: Build Horizon Rust renderer for Android x86_64 (emulator)
        run: cargo build --release --target x86_64-linux-android -p horizon-android

      - name: Build Horizon vanilla preparer for Android ARM64
        run: cargo build --release --target aarch64-linux-android -p horizon-prepare

      - name: Stage Android preparer and Horizon-only support sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/app/src/main/assets/bin
          mkdir -p mobile/app/src/main/assets/prepare-root/crates/horizon-prepare/src
          mkdir -p mobile/app/src/main/assets/prepare-root/mods/horizon/src/test/java/dev/horizonlab
          install -m 0755 target/aarch64-linux-android/release/horizon-prepare mobile/app/src/main/assets/bin/horizon-prepare
          cp research-lock.json mobile/app/src/main/assets/prepare-root/research-lock.json
          cp crates/horizon-prepare/src/exporters.rs mobile/app/src/main/assets/prepare-root/crates/horizon-prepare/src/exporters.rs
          cp -a mods/horizon/src/test/java/dev/horizonlab/parity mobile/app/src/main/assets/prepare-root/mods/horizon/src/test/java/dev/horizonlab/

      - name: Stage native renderer libraries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/app/src/main/jniLibs/arm64-v8a mobile/app/src/main/jniLibs/x86_64
          cp target/aarch64-linux-android/release/libhorizon_android.so mobile/app/src/main/jniLibs/arm64-v8a/
          cp target/x86_64-linux-android/release/libhorizon_android.so mobile/app/src/main/jniLibs/x86_64/
          file mobile/app/src/main/jniLibs/arm64-v8a/libhorizon_android.so mobile/app/src/main/jniLibs/x86_64/libhorizon_android.so
          readelf -h mobile/app/src/main/jniLibs/arm64-v8a/libhorizon_android.so | grep -E "Machine:.*AArch64"
          readelf -h mobile/app/src/main/jniLibs/x86_64/libhorizon_android.so | grep -iE "Machine:.*x86-64"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: mobile
        run: gradle --no-daemon :app:assembleDebug

      - name: Inspect APK manifest and libraries
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "package:|launchable-activity|sdkVersion|targetSdkVersion|native-code" || true
          unzip -Z1 "$APK" | grep -E "lib/arm64-v8a/|lib/x86_64/" || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install Android 12 (API 31) emulator system image
        run: |
          sdkmanager --install "emulator" "platform-tools" "platforms;android-31" "build-tools;35.0.0" "system-images;android-31;google_apis;x86_64" > /dev/null

      - name: Create AVD
        shell: bash
        run: |
          set -euo pipefail
          # Recent Android SDK command-line tools store AVDs under ANDROID_USER_HOME,
          # while the emulator may otherwise search only ~/.android/avd.
          ANDROID_USER_HOME="${ANDROID_USER_HOME:-$HOME/.config/.android}"
          export ANDROID_USER_HOME
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_USER_HOME=$ANDROID_USER_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n horizon-a12 -k "system-images;android-31;google_apis;x86_64" -d pixel_4 --force
          test -f "$ANDROID_AVD_HOME/horizon-a12.ini" || test -d "$ANDROID_AVD_HOME/horizon-a12.avd"
          avdmanager list avd

      - name: Boot emulator
        shell: bash
        run: |
          set -uo pipefail
          # Use the exact same AVD directory used by avdmanager in the previous step.
          ANDROID_USER_HOME="${ANDROID_USER_HOME:-$HOME/.config/.android}"
          export ANDROID_USER_HOME
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          echo "AVDs visíveis para o emulator:"
          emulator -list-avds || true
          if [ ! -f "$ANDROID_AVD_HOME/horizon-a12.ini" ] && [ ! -d "$ANDROID_AVD_HOME/horizon-a12.avd" ]; then
            echo "AVD horizon-a12 não existe em $ANDROID_AVD_HOME"
            find "$ANDROID_USER_HOME" -maxdepth 3 \( -name 'horizon-a12.ini' -o -name 'horizon-a12.avd' \) -print || true
            exit 1
          fi
          EMU_BIN="$(command -v emulator || true)"
          if [ -z "$EMU_BIN" ] && [ -x "$ANDROID_HOME/emulator/emulator" ]; then EMU_BIN="$ANDROID_HOME/emulator/emulator"; fi
          echo "Usando emulador: ${EMU_BIN:-nenhum}"
          if [ -z "$EMU_BIN" ]; then
            echo "Binário do emulador não encontrado no PATH nem em $ANDROID_HOME/emulator"
            ls -la "$ANDROID_HOME/emulator" 2>/dev/null || true
            exit 1
          fi
          "$EMU_BIN" -avd horizon-a12 -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 2048 -no-snapshot -camera-back none -camera-front none > emulator-boot.log 2>&1 &
          if ! timeout 180 adb wait-for-device; then
            echo "adb wait-for-device falhou; últimas linhas do log do emulador:"
            tail -n 100 emulator-boot.log || true
            exit 1
          fi
          if ! timeout 600 bash -c 'while [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" != "1" ]; do sleep 10; done'; then
            echo "Emulador não concluiu o boot em 10 minutos; últimas linhas do log:"
            tail -n 100 emulator-boot.log || true
            exit 1
          fi
          adb devices
          echo "Android release: $(adb shell getprop ro.build.version.release | tr -d '\r')"
          echo "Android SDK: $(adb shell getprop ro.build.version.sdk | tr -d '\r')"
          echo "ABI list: $(adb shell getprop ro.product.cpu.abilist | tr -d '\r')"

      - name: Install APK and launch the launcher
        shell: bash
        run: |
          set -uo pipefail
          if ! adb install -r mobile/app/build/outputs/apk/debug/app-debug.apk; then
            echo "Falha ao instalar o APK no emulador"
            exit 1
          fi
          adb logcat -c
          adb shell am start -W -n dev.playhorizon.mobile/.MainActivity || true
          sleep 30
          adb shell pidof dev.playhorizon.mobile > app-pid.txt || true
          adb logcat -d -b crash > emulator-crash-buffer.txt || true
          adb logcat -d -t 12000 > emulator-logcat.txt
          adb shell "run-as dev.playhorizon.mobile cat files/horizon-diagnostics/launch-log.txt 2>/dev/null" > launch-log-device.txt || true
          adb shell "run-as dev.playhorizon.mobile cat files/horizon-diagnostics/crash-log.txt 2>/dev/null" > launcher-crash-log.txt || true
          echo "PID after 30s: $(cat app-pid.txt 2>/dev/null || echo vazio)"
          adb shell dumpsys activity activities | grep -E "dev.playhorizon" | head -10 || true

      - name: Launch the native engine (NativeActivity)
        shell: bash
        run: |
          set -uo pipefail
          adb logcat -c
          # NativeActivity is intentionally not exported. A shell-originated
          # am start is rejected by Android and does not exercise the engine.
          # Do not misreport that permission denial as an engine crash.
          echo "SKIPPED: NativeActivity is not exported; engine must be launched by MainActivity." > engine-test-status.txt
          : > engine-pid.txt
          : > engine-crash-buffer.txt
          : > engine-logcat.txt
          : > startup-status.txt
          adb shell "run-as dev.playhorizon.mobile cat files/horizon-diagnostics/launch-log.txt 2>/dev/null" > engine-launch-log.txt || true
          adb shell "run-as dev.playhorizon.mobile cat files/horizon-diagnostics/crash-log.txt 2>/dev/null" > engine-crash-log.txt || true
          echo "Teste do motor: iniciado somente pelo próprio app; tentativa externa desativada."
          cat engine-test-status.txt

      - name: Verdict
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p mobile/diagnostics
          PID="$(tr -d '\r[:space:]' < app-pid.txt 2>/dev/null || true)"
          ENGINE_PID="$(tr -d '\r[:space:]' < engine-pid.txt 2>/dev/null || true)"
          {
            echo "Emulador: Android 12 (API 31), x86_64 com KVM, GPU SwiftShader."
            echo "APK: app-debug.apk (arm64-v8a + x86_64), instalado e iniciado com am start."
            echo "Observação: valida ciclo de vida, JNI e boot do motor; a GPU real do Galaxy A12 (PowerVR GE8320) só pode ser validada no aparelho físico."
            if [ -n "$PID" ]; then
              echo "RESULTADO LAUNCHER: permaneceu aberto (pid $PID) 30 s após a abertura."
            else
              echo "RESULTADO LAUNCHER: FALHA. O processo não estava vivo 30 s após a abertura."
            fi
            echo "RESULTADO MOTOR: NÃO TESTADO. O componente NativeActivity não é exportado; o shell do emulador não pode iniciá-lo diretamente."
            cat engine-test-status.txt 2>/dev/null || true
            if [ -s launcher-crash-log.txt ]; then
              echo "Crash log privado do launcher:"
              tail -n 160 launcher-crash-log.txt
            fi
            if [ -s startup-status.txt ]; then
              echo "Status nativo de inicialização:"
              cat startup-status.txt
            fi
            if [ -s engine-crash-buffer.txt ]; then
              echo "Buffer de crash do logcat não vazio; primeiras ocorrências:"
              grep -nE "FATAL EXCEPTION|Fatal signal|SIGSEGV|SIGABRT|Process: dev.playhorizon" engine-crash-buffer.txt | head -40 || true
              head -200 engine-crash-buffer.txt
            fi
          } > mobile/diagnostics/emulator-summary.txt
          cat mobile/diagnostics/emulator-summary.txt
          if [ -z "$PID" ]; then
            echo "Launcher não permaneceu ativo; consulte crash-log privado."
            exit 1
          fi
          if grep -qE "FATAL EXCEPTION|Fatal signal" engine-crash-buffer.txt engine-logcat.txt launcher-crash-log.txt; then
            echo "Marcador de crash encontrado no logcat mesmo com o processo vivo."
            exit 1
          fi

      - name: Publish diagnostics to the branch
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p mobile/diagnostics
          cp emulator-crash-buffer.txt mobile/diagnostics/emulator-crash-buffer.txt 2>/dev/null || true
          cp engine-crash-buffer.txt mobile/diagnostics/engine-crash-buffer.txt 2>/dev/null || true
          cp emulator-logcat.txt mobile/diagnostics/emulator-logcat.txt 2>/dev/null || true
          cp engine-logcat.txt mobile/diagnostics/engine-logcat.txt 2>/dev/null || true
          cp emulator-boot.log mobile/diagnostics/emulator-boot.log 2>/dev/null || true
          cp startup-status.txt mobile/diagnostics/emulator-startup-status.txt 2>/dev/null || true
          cp launch-log-device.txt mobile/diagnostics/emulator-launch-log.txt 2>/dev/null || true
          cp engine-launch-log.txt mobile/diagnostics/engine-launch-log.txt 2>/dev/null || true
          cp launcher-crash-log.txt mobile/diagnostics/launcher-crash-log.txt 2>/dev/null || true
          cp engine-crash-log.txt mobile/diagnostics/engine-crash-log.txt 2>/dev/null || true
          cp engine-test-status.txt mobile/diagnostics/engine-test-status.txt 2>/dev/null || true
          cp app-pid.txt mobile/diagnostics/emulator-app-pid.txt 2>/dev/null || true
          cp engine-pid.txt mobile/diagnostics/engine-app-pid.txt 2>/dev/null || true
          git config user.name "Horizon CI"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/diagnostics
          if git commit -m "Record Android 12 emulator boot diagnostics [skip ci]"; then
            git pull --rebase --autostash origin mobile/android-port || true
            git push origin HEAD:mobile/android-port || echo "Falha ao publicar os diagnósticos (conflito de push)."
          else
            echo "Nada novo para registrar."
          fi

      - name: Upload boot-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: horizon-boot-test-api31
          path: |
            mobile/diagnostics/emulator-summary.txt
            mobile/diagnostics/engine-logcat.txt
            mobile/diagnostics/launcher-crash-log.txt
            mobile/diagnostics/engine-crash-log.txt
            mobile/diagnostics/engine-test-status.txt
            mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
