name: Build Android Java 25 JDK

on:
  push:
    branches: [mobile/android-port]
    paths:
      - ".github/workflows/android-jdk25.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-jdk25-arm64
  cancel-in-progress: false

jobs:
  build-jdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout Android OpenJDK build scripts
        uses: actions/checkout@v4
        with:
          repository: FCL-Team/Android-OpenJDK-Build
          ref: Build_JRE_25
          path: android-openjdk

      - name: Patch Android getifaddrs compatibility and disable jsound
        working-directory: android-openjdk
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          script = Path("build_jdk.sh")
          text = script.read_text()
          anchor = 'git apply --reject --whitespace=fix ../patches/jdk25u_android.diff || echo "git apply failed (Android patch set)"'
          fallback = r'''git apply --reject --whitespace=fix ../patches/jdk25u_android.diff || echo "git apply failed (Android patch set)"
          # The upstream patch's os_perf_linux.cpp hunk can drift as jdk25u changes.
          # Reapply that Android-only compatibility block by a stable include anchor.
          python3 - <<'PY_ANDROID_IFADDRS'
          from pathlib import Path

          source = Path("src/hotspot/os/linux/os_perf_linux.cpp")
          patch = Path("../patches/jdk25u_android.diff")
          code = source.read_text()
          diff = patch.read_text()
          marker = "int getifaddrs(ifaddrs** out)"
          section_start = diff.index("diff --git a/src/hotspot/os/linux/os_perf_linux.cpp")
          hunk_start = diff.index("@@", section_start)
          next_file = diff.find("\ndiff --git ", hunk_start)
          hunk = diff[hunk_start: next_file if next_file >= 0 else len(diff)]
          added = "\n".join(line[1:] for line in hunk.splitlines() if line.startswith("+") and not line.startswith("+++"))
          added = added.replace("#ifndef __ANDROID__\n", "#ifndef __ANDROID__\n#include <ifaddrs.h>\n", 1)
          if marker not in code:
              include = "#include <ifaddrs.h>"
              if code.count(include) != 1:
                  raise SystemExit("Expected exactly one ifaddrs include in os_perf_linux.cpp")
              code = code.replace(include, added, 1)
          # Fix allocator ownership in the imported Android netlink implementation.
          code = code.replace(
              "ifaddrs_storage *storage = nullptr;\n  memset(storage, 0, sizeof(*storage));",
              "ifaddrs_storage *storage = NEW_C_HEAP_OBJ(ifaddrs_storage, mtInternal);\n"
              "  if (storage == nullptr) return nullptr;\n"
              "  memset(storage, 0, sizeof(*storage));"
          )
          code = code.replace("    free(current);", "    FREE_C_HEAP_OBJ(reinterpret_cast<ifaddrs_storage*>(current));")
          code = code.replace(
              "ifaddrs_storage* new_addr = new_ifaddrs_storage(out);\n    new_addr->interface_index",
              "ifaddrs_storage* new_addr = new_ifaddrs_storage(out);\n"
              "    if (new_addr == nullptr) return;\n"
              "    new_addr->interface_index"
          )
          code = code.replace(
              "ifaddrs_storage* new_addr = new_ifaddrs_storage(out);\n    // We can just copy",
              "ifaddrs_storage* new_addr = new_ifaddrs_storage(out);\n"
              "    if (new_addr == nullptr) return;\n"
              "    // We can just copy"
          )
          if marker not in code or "NEW_C_HEAP_OBJ(ifaddrs_storage, mtInternal)" not in code or "FREE_C_HEAP_OBJ(reinterpret_cast<ifaddrs_storage*>(current))" not in code:
              raise SystemExit("Android getifaddrs compatibility patch validation failed")
          source.write_text(code)
          PY_ANDROID_IFADDRS

          python3 - <<'PY_ANDROID_LIBJSOUND'
          from pathlib import Path
          import glob
          gmk = Path("make/modules/java.desktop/Lib.gmk")
          code = gmk.read_text()
          if "TARGETS += $(BUILD_LIBJSOUND)" in code and "# TARGETS += $(BUILD_LIBJSOUND)" not in code:
              code = code.replace("TARGETS += $(BUILD_LIBJSOUND)", "# TARGETS += $(BUILD_LIBJSOUND) (disabled for Android: no ALSA userland)", 1)
              gmk.write_text(code)
              print("Android build: libjsound disabled (no ALSA userland on Android)")
          else:
              print("Android build: libjsound target not found or already disabled")
          rejs = sorted(glob.glob("**/*.rej", recursive=True))
          if rejs:
              print("Android patch rejects: %d" % len(rejs))
              for r in rejs[:30]:
                  print("  REJ:", r)
          else:
              print("Android patch applied with no rejects")
          PY_ANDROID_LIBJSOUND
          '''
          fallback = chr(10).join(line[10:] if line.startswith("          ") else line for line in fallback.splitlines()) + chr(10)
          if anchor not in text:
              raise SystemExit("Could not find Android patch application command in build_jdk.sh")
          changed = False
          if "PY_ANDROID_IFADDRS" not in text:
              text = text.replace(anchor, fallback, 1)
              changed = True
          # Official switch: jdk25u's make/autoconf/jdk-options.m4 exposes
          # --disable-jsound (UTIL_ARG_ENABLE NAME: jsound, RESULT: ENABLE_JSOUND).
          # java.desktop/Lib.gmk only defines BUILD_LIBJSOUND inside
          # ifeq ($(ENABLE_JSOUND), true), so this removes ALSA from the build
          # regardless of which Lib.gmk revision is checked out. The Lib.gmk
          # guard above stays as a second layer of defense.
          cfg_anchor = "    --enable-headless-only=yes \\"
          if "--disable-jsound" not in text:
              if cfg_anchor not in text:
                  raise SystemExit("Could not find --enable-headless-only=yes in build_jdk.sh")
              text = text.replace(cfg_anchor, cfg_anchor + "\n    --disable-jsound \\", 1)
              changed = True
          if changed:
              script.write_text(text)
          print("build_jdk.sh patched: getifaddrs fallback installed and jsound disabled")
          PY

      - name: Show the patched configure invocation
        working-directory: android-openjdk
        shell: bash
        run: grep -n -- "--disable-jsound" build_jdk.sh

      - name: Install Android NDK for ARM64 C++ runtime
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.2.12479018"

      - name: Build full OpenJDK 25 for Android ARM64
        working-directory: android-openjdk
        shell: bash
        run: |
          set -euo pipefail
          # The upstream build can fail deep inside the JDK's own makefiles; keep
          # the full output in a file so a failure step can show the real error.
          bash ci_build_arch_aarch64.sh 2>&1 | tee jdk-build.log
          test -x jdkout/bin/java
          test -x jdkout/bin/javac
          file jdkout/bin/java jdkout/bin/javac
          readelf -h jdkout/bin/java | grep -E 'Machine:.*AArch64'
          readelf -h jdkout/bin/javac | grep -E 'Machine:.*AArch64'

      - name: Verify javac launcher integrity before packaging
        working-directory: android-openjdk
        shell: bash
        run: |
          set -euo pipefail
          # A real javac launcher is compiled with -DJAVA_ARGS='{... "-m",
          # "jdk.compiler/com.sun.tools.javac.Main" ...}', so the class name is
          # embedded in the binary and '-version' is forwarded to the compiler
          # instead of being consumed by the java option parser. A javac that is
          # a symlink to java (zip stores the target's content) or a copy of the
          # java launcher answers 'javac -version' with the JAVA banner and exit
          # code 0, which is exactly the failure users saw on device. Fail here,
          # before the release is updated, and keep the evidence in the log.
          {
            echo "== ls -la jdkout/bin/java jdkout/bin/javac =="
            ls -la jdkout/bin/java jdkout/bin/javac
            if [ -L jdkout/bin/javac ]; then
              echo "FALHA: jdkout/bin/javac e um link simbolico para $(readlink jdkout/bin/javac)."
              echo "O empacotamento com zip (sem -y) guardaria o conteudo do java como javac,"
              echo "e o app receberia um 'javac' que se comporta como o launcher do java."
              exit 1
            fi
            if cmp -s jdkout/bin/java jdkout/bin/javac; then
              echo "FALHA: jdkout/bin/javac e uma copia byte a byte de jdkout/bin/java."
              exit 1
            fi
            if ! strings jdkout/bin/javac | grep -aq 'jdk.compiler/com.sun.tools.javac.Main'; then
              echo "FALHA: jdkout/bin/javac nao embute a classe principal do compilador"
              echo "(jdk.compiler/com.sun.tools.javac.Main). Sem esse JAVA_ARGS compilado no"
              echo "launcher, '-version' e tratado como opcao do java e o binario imprime o"
              echo "banner do java em vez de 'javac 25.x'. Amostra de strings do binario:"
              strings jdkout/bin/javac | grep -aE 'version|Main|javac' | head -20 || true
              exit 1
            fi
            if strings jdkout/bin/java | grep -aq 'jdk.compiler/com.sun.tools.javac.Main'; then
              echo "FALHA inesperada: jdkout/bin/java embute a classe principal do javac."
              exit 1
            fi
            test -s jdkout/jmods/jdk.compiler.jmod || { echo "FALHA: jdkout/jmods/jdk.compiler.jmod ausente."; exit 1; }
            JIMAGE="openjdk/build/linux-aarch64-server-release/buildjdk/jdk/bin/jimage"
            if [ -x "$JIMAGE" ]; then
              "$JIMAGE" list jdkout/lib/modules | grep -m1 '^jdk.compiler/' >/dev/null || {
                echo "FALHA: o modulo jdk.compiler nao esta em jdkout/lib/modules."
                exit 1
              }
              echo "OK: modulo jdk.compiler presente em lib/modules."
            else
              echo "AVISO: jimage do build nao encontrado em $JIMAGE; checagem de lib/modules pulada."
            fi
            echo "OK: bin/javac e um launcher proprio do compilador (classe embutida; nao e copia nem symlink do java)."
          } 2>&1 | tee jdk-launcher-check.log

      - name: Verify jsound was disabled in the JDK configuration
        if: always()
        working-directory: android-openjdk
        shell: bash
        run: |
          SPEC="openjdk/build/linux-aarch64-server-release/spec.gmk"
          if [ -f "$SPEC" ]; then
            grep -n "^ENABLE_JSOUND" "$SPEC" || echo "ENABLE_JSOUND ausente do spec.gmk"
          else
            echo "spec.gmk ainda nao existe (configure nao rodou)."
          fi

      - name: Show why the upstream JDK build failed
        if: failure()
        working-directory: android-openjdk
        shell: bash
        run: |
          if [ -f jdk-build.log ]; then
            echo "===== last 200 lines of the OpenJDK build log ====="
            tail -n 200 jdk-build.log
          else
            echo "jdk-build.log was not created; the failure happened before the build started."
          fi
          if [ -f jdk-launcher-check.log ]; then
            echo "===== javac launcher integrity check output ====="
            cat jdk-launcher-check.log
          fi

      - name: Publish JDK build failure diagnostics to the branch
        if: failure()
        uses: actions/checkout@v4
        with:
          ref: mobile/android-port
          path: repo-diagnostics

      - name: Commit JDK build failure log
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repo-diagnostics/mobile/diagnostics
          if [ -f android-openjdk/jdk-build.log ]; then
            {
              echo "===== rejeicoes de patch / erros ====="
              grep -nE "reject|hunks|REJ:|error:" android-openjdk/jdk-build.log | head -60 || true
              echo "===== ultimas 300 linhas da build ====="
              tail -n 300 android-openjdk/jdk-build.log
            } > repo-diagnostics/mobile/diagnostics/jdk-build-failure.log
          else
            echo "jdk-build.log was not created; the failure happened before the build started." > repo-diagnostics/mobile/diagnostics/jdk-build-failure.log
          fi
          if [ -f android-openjdk/jdk-launcher-check.log ]; then
            {
              echo ""
              echo "===== verificacao de integridade do launcher javac ====="
              cat android-openjdk/jdk-launcher-check.log
            } >> repo-diagnostics/mobile/diagnostics/jdk-build-failure.log
          fi
          cd repo-diagnostics
          git config user.name "horizon-diagnostics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add mobile/diagnostics/jdk-build-failure.log
          git commit -m "diagnostics: registrar falha da build do OpenJDK 25 ARM64 [skip ci]" || echo "nothing to commit"
          git pull --rebase origin mobile/android-port || true
          git push origin HEAD:mobile/android-port

      - name: Package JDK and generate integrity manifest
        working-directory: android-openjdk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime-package/jdk
          cp -a jdkout/. runtime-package/jdk/
          chmod +x runtime-package/jdk/bin/java runtime-package/jdk/bin/javac

          # The FCL Android OpenJDK launchers are linked against libc++_shared.so.
          # Bundle the matching Android NDK ARM64 C++ runtime beside the JDK's
          # other private libraries; Android's system linker will find it through
          # the app-provided LD_LIBRARY_PATH ($JAVA_HOME/lib).
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          CXX_RUNTIME="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          test -s "$CXX_RUNTIME"
          install -m 0644 "$CXX_RUNTIME" runtime-package/jdk/lib/libc++_shared.so
          file runtime-package/jdk/lib/libc++_shared.so
          readelf -h runtime-package/jdk/lib/libc++_shared.so | grep -E 'Class:.*ELF64'
          readelf -h runtime-package/jdk/lib/libc++_shared.so | grep -E 'Machine:.*AArch64'

          # Fail the release build if either launcher has an unaccounted
          # non-platform dependency. This catches missing runtime libraries
          # before users download an APK.
          for launcher in runtime-package/jdk/bin/java runtime-package/jdk/bin/javac; do
            echo "Dependencies for $launcher:"
            readelf -d "$launcher" | grep 'NEEDED' || true
            if readelf -d "$launcher" | grep -q 'Shared library: \[libc++_shared.so\]'; then
              test -s runtime-package/jdk/lib/libc++_shared.so
            fi
          done
          (cd runtime-package && zip -qr -9 ../horizon-jdk25-android-arm64.zip jdk)
          SHA="$(sha256sum horizon-jdk25-android-arm64.zip | cut -d' ' -f1)"
          cat > runtime.json <<EOF
          {
            "schema": 1,
            "java_major": 25,
            "os": "android",
            "architecture": "aarch64",
            "archive": "horizon-jdk25-android-arm64.zip",
            "sha256": "$SHA"
          }
          EOF
          unzip -l horizon-jdk25-android-arm64.zip | grep -E 'jdk/bin/(java|javac)$'
          if unzip -l horizon-jdk25-android-arm64.zip | grep -q 'libjsound'; then
            echo "AVISO: libjsound presente no pacote mesmo com jsound desativado."
          else
            echo "OK: pacote sem libjsound."
          fi
          cat runtime.json

      - name: Publish versioned Android JDK runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: android-openjdk
        shell: bash
        run: |
          set -euo pipefail
          TAG="android-jdk25-arm64"
          gh release view "$TAG" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "${GITHUB_REPOSITORY}" \
              --title "Horizon Android OpenJDK 25 ARM64" \
              --notes "Android ARM64 OpenJDK 25 full JDK for the Horizon vanilla resource preparer. Built from FCL-Team/Android-OpenJDK-Build branch Build_JRE_25. Contains Java and javac; no Minecraft game files."
          gh release upload "$TAG" horizon-jdk25-android-arm64.zip runtime.json \
            --repo "${GITHUB_REPOSITORY}" --clobber
