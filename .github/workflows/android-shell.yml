name: Android mobile shell

on:
  push:
    branches: [mobile/android-port]
    paths:
      - "mobile/**"
      - "crates/horizon-android/**"
      - "crates/horizon-threads/**"
      - "crates/horizon-client/**"
      - "crates/horizon-client-lib/**"
      - "crates/horizon-client-input/**"
      - "crates/horizon-client-render/**"
      - "crates/horizon-prepare/**"
      - "mods/horizon/src/test/java/dev/horizonlab/parity/**"
      - "research-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-shell.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "crates/horizon-android/**"
      - "crates/horizon-client/**"
      - "crates/horizon-client-lib/**"
      - "crates/horizon-client-input/**"
      - "crates/horizon-client-render/**"
      - "crates/horizon-prepare/**"
      - "mods/horizon/src/test/java/dev/horizonlab/parity/**"
      - "research-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-shell.yml"
  workflow_dispatch:

concurrency:
  group: android-mobile-shell-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.2.12479018"
      - name: Configure Android ARM64 linker
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
      - name: Build Horizon Rust renderer for Android ARM64
        run: cargo build --release --target aarch64-linux-android -p horizon-android
      - name: Build Horizon vanilla preparer for Android ARM64
        run: cargo build --release --target aarch64-linux-android -p horizon-prepare
      - name: Stage Android preparer and Horizon-only support sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/app/src/main/assets/bin
          mkdir -p mobile/app/src/main/assets/prepare-root/crates/horizon-prepare/src
          mkdir -p mobile/app/src/main/assets/prepare-root/mods/horizon/src/test/java/dev/horizonlab
          install -m 0755 target/aarch64-linux-android/release/horizon-prepare mobile/app/src/main/assets/bin/horizon-prepare
          cp research-lock.json mobile/app/src/main/assets/prepare-root/research-lock.json
          cp crates/horizon-prepare/src/exporters.rs mobile/app/src/main/assets/prepare-root/crates/horizon-prepare/src/exporters.rs
          cp -a mods/horizon/src/test/java/dev/horizonlab/parity mobile/app/src/main/assets/prepare-root/mods/horizon/src/test/java/dev/horizonlab/
          test -x mobile/app/src/main/assets/bin/horizon-prepare
          test -s mobile/app/src/main/assets/prepare-root/research-lock.json
          test -s mobile/app/src/main/assets/prepare-root/crates/horizon-prepare/src/exporters.rs
          test -d mobile/app/src/main/assets/prepare-root/mods/horizon/src/test/java/dev/horizonlab/parity
      - name: Stage native renderer for Android packaging
        shell: bash
        run: |
          mkdir -p mobile/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libhorizon_android.so mobile/app/src/main/jniLibs/arm64-v8a/
          LIB="mobile/app/src/main/jniLibs/arm64-v8a/libhorizon_android.so"
          test -s "$LIB"
          file "$LIB"
          readelf -h "$LIB" | grep -E 'Class:.*ELF64'
          readelf -h "$LIB" | grep -E 'Machine:.*AArch64'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Android shell and merge native library (no APK)
        working-directory: mobile
        run: gradle --no-daemon :app:compileDebugKotlin :app:processDebugManifest :app:mergeDebugNativeLibs :app:mergeDebugAssets
      - name: Verify ARM64 library was merged for Android packaging
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="mobile/app/src/main/jniLibs/arm64-v8a/libhorizon_android.so"
          test -s "$SOURCE"
          mapfile -t MERGED < <(find mobile/app/build/intermediates/merged_native_libs/debug -type f -path '*/lib/arm64-v8a/libhorizon_android.so' -print)
          if [ "${#MERGED[@]}" -ne 1 ]; then
            echo "Expected exactly one merged ARM64 Horizon library; found ${#MERGED[@]}."
            find mobile/app/build/intermediates/merged_native_libs/debug -type f -print || true
            exit 1
          fi
          cmp --silent "$SOURCE" "${MERGED[0]}"
          echo "Verified packaged merge input: ${MERGED[0]}"
      - name: Publish Android ARM64 native library
        uses: actions/upload-artifact@v4
        with:
          name: libhorizon-android-arm64
          path: mobile/app/src/main/jniLibs/arm64-v8a/libhorizon_android.so
          if-no-files-found: error
          retention-days: 14
