name: Android mobile shell

on:
  push:
    branches: [mobile/android-port]
    paths:
      - "mobile/**"
      - "crates/horizon-android/**"
      - "crates/horizon-threads/**"
      - "crates/horizon-client/**"
      - "crates/horizon-client-lib/**"
      - "crates/horizon-client-input/**"
      - "crates/horizon-client-render/**"
      - "crates/horizon-prepare/**"
      - "mods/horizon/src/test/java/dev/horizonlab/parity/**"
      - "research-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-shell.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "crates/horizon-android/**"
      - "crates/horizon-client/**"
      - "crates/horizon-client-lib/**"
      - "crates/horizon-client-input/**"
      - "crates/horizon-client-render/**"
      - "crates/horizon-android/**"
      - "crates/horizon-threads/**"
      - "crates/horizon-prepare/**"
      - "mods/horizon/src/test/java/dev/horizonlab/parity/**"
      - "research-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/android-shell.yml"
  workflow_dispatch:

concurrency:
  group: android-mobile-shell-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: "ndk;27.2.12479018"
      - name: Configure Android ARM64 linker
        shell: bash
        run: |
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          test -x "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar" >> "$GITHUB_ENV"
      - name: Build Horizon Rust renderer for Android ARM64
        run: cargo build --release --target aarch64-linux-android -p horizon-android
      - name: Build Horizon vanilla preparer for Android ARM64
        run: cargo build --release --target aarch64-linux-android -p horizon-prepare
      - name: Stage Android preparer and Horizon-only support sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile/app/src/main/assets/bin
          mkdir -p mobile/app/src/main/assets/prepare-root/crates/horizon-prepare/src
          mkdir -p mobile/app/src/main/assets/prepare-root/mods/horizon/src/test/java/dev/horizonlab
          install -m 0755 target/aarch64-linux-android/release/horizon-prepare mobile/app/src/main/assets/bin/horizon-prepare
          cp research-lock.json mobile/app/src/main/assets/prepare-root/research-lock.json
          cp crates/horizon-prepare/src/exporters.rs mobile/app/src/main/assets/prepare-root/crates/horizon-prepare/src/exporters.rs
          cp -a mods/horizon/src/test/java/dev/horizonlab/parity mobile/app/src/main/assets/prepare-root/mods/horizon/src/test/java/dev/horizonlab/
          test -x mobile/app/src/main/assets/bin/horizon-prepare
          test -s mobile/app/src/main/assets/prepare-root/research-lock.json
          test -s mobile/app/src/main/assets/prepare-root/crates/horizon-prepare/src/exporters.rs
          test -d mobile/app/src/main/assets/prepare-root/mods/horizon/src/test/java/dev/horizonlab/parity
      - name: Stage native renderer and required shared libraries
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          LIBDIR="mobile/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$LIBDIR"
          cp target/aarch64-linux-android/release/libhorizon_android.so "$LIBDIR/"
          LIB="$LIBDIR/libhorizon_android.so"
          test -s "$LIB"
          file "$LIB"
          readelf -h "$LIB" | grep -E 'Class:.*ELF64'
          readelf -h "$LIB" | grep -E 'Machine:.*AArch64'

          mapfile -t NEEDED < <(readelf -d "$LIB" | grep -o 'Shared library: \[[^]]*\]' | cut -d'[' -f2 | tr -d ']')
          printf 'Native runtime DT_NEEDED dependencies:\n'
          printf '  %s\n' "${NEEDED[@]}"

          # Rust normally links against Android's platform C runtime. If a future
          # dependency introduces libc++_shared, ship the matching ARM64 NDK copy.
          if printf '%s\n' "${NEEDED[@]}" | grep -qx 'libc++_shared.so'; then
            CXX_RUNTIME="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
            test -s "$CXX_RUNTIME"
            cp "$CXX_RUNTIME" "$LIBDIR/libc++_shared.so"
            readelf -h "$LIBDIR/libc++_shared.so" | grep -E 'Machine:.*AArch64'
          fi

          for dep in "${NEEDED[@]}"; do
            case "$dep" in
              libc.so|libm.so|libdl.so|liblog.so|libandroid.so|libz.so|libvulkan.so|libEGL.so|libGLESv2.so|libOpenSLES.so|libjnigraphics.so|libnativewindow.so|libsync.so|libmediandk.so|libaaudio.so|libcamera2ndk.so|libstdc++.so|libc++_shared.so)
                ;;
              *)
                echo "Unaccounted native shared-library dependency: $dep"
                exit 1
                ;;
            esac
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile Android shell and merge native libraries
        working-directory: mobile
        run: gradle --no-daemon :app:compileDebugKotlin :app:processDebugManifest :app:mergeDebugNativeLibs :app:mergeDebugAssets
      - name: Build installable debug APK
        working-directory: mobile
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="mobile/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK" | grep -Eqi "Android package|Zip archive"
          unzip -t "$APK" >/dev/null
          APK_ENTRIES="$(unzip -Z1 "$APK")"
          grep -Fx "lib/arm64-v8a/libhorizon_android.so" <<< "$APK_ENTRIES" >/dev/null
          echo "Validated installable ARM64 debug APK: $APK"
      - name: Verify ARM64 native libraries were merged
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="mobile/app/src/main/jniLibs/arm64-v8a"
          MERGED_DIR="mobile/app/build/intermediates/merged_native_libs/debug"
          test -s "$SOURCE_DIR/libhorizon_android.so"
          mapfile -t SOURCE_LIBS < <(find "$SOURCE_DIR" -maxdepth 1 -type f -name '*.so' -printf '%f\n' | sort)
          mapfile -t MERGED_LIBS < <(find "$MERGED_DIR" -type f -path '*/lib/arm64-v8a/*.so' -printf '%f\n' | sort -u)
          if [ "${SOURCE_LIBS[*]}" != "${MERGED_LIBS[*]}" ]; then
            echo "Source and Gradle-merged ARM64 native libraries differ."
            echo "Source: ${SOURCE_LIBS[*]}"
            echo "Merged: ${MERGED_LIBS[*]}"
            exit 1
          fi
          for name in "${SOURCE_LIBS[@]}"; do
            mapfile -t COPIES < <(find "$MERGED_DIR" -type f -path "*/lib/arm64-v8a/$name" -print)
            if [ "${#COPIES[@]}" -ne 1 ]; then
              echo "Expected exactly one merged copy of $name; found ${#COPIES[@]}."
              exit 1
            fi
            cmp --silent "$SOURCE_DIR/$name" "${COPIES[0]}"
          done
          echo "Verified all ARM64 runtime libraries merged byte-for-byte."
      - name: Publish installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: horizon-rust-mobile-debug-apk
          path: mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: "Horizon Android APK #${{ github.run_number }}"
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: mobile/app/build/outputs/apk/debug/app-debug.apk
          body: |
            APK Android gerado automaticamente pelo workflow Android mobile shell.

            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Execução: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Este build é independente dos demais; cada execução recebe uma Release/tag própria.
      - name: Publish Android ARM64 native runtime libraries
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-arm64-runtime-libraries
          path: mobile/app/src/main/jniLibs/arm64-v8a/*.so
          if-no-files-found: error
          retention-days: 14

# Android debug APK is validated, uploaded as an Actions artifact, and published to a unique GitHub Release.
